<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Split PDF Fadiel</title>

  <link href="mergepdf/bootstrap.css" rel="stylesheet">

  <style>
    body { background:#f1f3f5; }
    header {
      background: linear-gradient(135deg, #198754, #20c997);
      color: white;
      padding: 2rem 1rem;
      margin-bottom: 2rem;
      text-align: center;
      border-radius: 0 0 1rem 1rem;
    }
    .card {
      box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.1);
      border: none;
    }
    footer { margin-top: 3rem; text-align: center; color:#6c757d; }
  </style>
</head>
<body>
  <header>
    <h1 class="fw-bold">Split PDF</h1>
    <p class="lead mb-0">Pisahkan halaman PDF sesuai kebutuhan Anda</p>
  </header>

  <main class="container">
    <div class="card p-4 mb-4">
      <div class="mb-3">
        <label for="pdfFile" class="form-label fw-semibold">Pilih file PDF</label>
        <input class="form-control form-control-lg" type="file" id="pdfFile" accept="application/pdf">
      </div>

      <div class="mb-3">
        <label for="pageRange" class="form-label fw-semibold">Halaman yang ingin dipisah</label>
        <input class="form-control" id="pageRange" placeholder="Contoh: 1-3,5,7-8">
        <div class="form-text">Gunakan format: <code>1-3,5,7-8</code> (artinya halaman 1 s/d 3, halaman 5, dan 7 s/d 8).</div>
      </div>

      <div class="d-flex flex-wrap gap-2">
        <button id="splitBtn" class="btn btn-success btn-lg" disabled>Split PDF</button>
        <button id="clearBtn" class="btn btn-outline-secondary btn-lg">Clear</button>
        <div id="spinner" class="align-self-center d-none">
          <div class="spinner-border text-success" role="status" aria-hidden="true"></div>
          <span class="ms-2">Memproses...</span>
        </div>
      </div>

      <div class="mt-4" id="outArea"></div>
    </div>
  </main>

  <footer class="small">
    Silahkan Dicoba :)
  </footer>

  <!-- pdf-lib -->
  <script src="mergepdf/pdf-lib.min.js"></script>
  <script src="mergepdf/bootstrap.bundle.min.js"></script>

  <script>
    const pdfFileInput = document.getElementById('pdfFile');
    const pageRangeInput = document.getElementById('pageRange');
    const splitBtn = document.getElementById('splitBtn');
    const clearBtn = document.getElementById('clearBtn');
    const outArea = document.getElementById('outArea');
    const spinner = document.getElementById('spinner');

    let selectedFile = null;

    pdfFileInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (file && (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf'))) {
        selectedFile = file;
        splitBtn.disabled = false;
      } else {
        alert('Hanya file PDF yang didukung.');
        pdfFileInput.value = '';
      }
    });

    clearBtn.addEventListener('click', () => {
      pdfFileInput.value = '';
      pageRangeInput.value = '';
      selectedFile = null;
      outArea.innerHTML = '';
      splitBtn.disabled = true;
    });

    splitBtn.addEventListener('click', async () => {
      if (!selectedFile) return;
      splitBtn.disabled = true;
      spinner.classList.remove('d-none');
      outArea.innerHTML = '';

      try {
        const bytes = await selectedFile.arrayBuffer();
        const pdfDoc = await PDFLib.PDFDocument.load(bytes);

        // parse range
        const rangeText = pageRangeInput.value.trim();
        if (!rangeText) throw new Error("Masukkan range halaman.");
        const ranges = parsePageRanges(rangeText, pdfDoc.getPageCount());

        let counter = 1;
        for (const r of ranges) {
          const newPdf = await PDFLib.PDFDocument.create();
          const pages = await newPdf.copyPages(pdfDoc, r.map(i => i-1));
          pages.forEach(p => newPdf.addPage(p));
          const newBytes = await newPdf.save();
          const blob = new Blob([newBytes], { type: 'application/pdf' });
          const url = URL.createObjectURL(blob);

          const link = document.createElement('a');
          link.href = url;
          link.download = `split_part${counter}.pdf`;
          link.className = "btn btn-primary btn-lg d-block mb-2";
          link.textContent = `Download split_part${counter}.pdf`;
          outArea.appendChild(link);

          counter++;
        }
      } catch (err) {
        alert('Gagal split PDF: ' + err.message);
      } finally {
        spinner.classList.add('d-none');
        splitBtn.disabled = false;
      }
    });

    function parsePageRanges(input, maxPage) {
      const parts = input.split(',');
      const ranges = [];
      for (const part of parts) {
        if (part.includes('-')) {
          const [start, end] = part.split('-').map(n => parseInt(n.trim()));
          if (isNaN(start) || isNaN(end) || start < 1 || end > maxPage || start > end) {
            throw new Error("Range halaman tidak valid.");
          }
          const arr = [];
          for (let i=start; i<=end; i++) arr.push(i);
          ranges.push(arr);
        } else {
          const n = parseInt(part.trim());
          if (isNaN(n) || n < 1 || n > maxPage) throw new Error("Nomor halaman tidak valid.");
          ranges.push([n]);
        }
      }
      return ranges;
    }
  </script>
</body>
</html>
